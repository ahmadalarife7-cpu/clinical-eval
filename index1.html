<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="التقييم السريري">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0b6b63">
<title>سجل التقييم السريري</title>
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
/* Layout: single column clinical clipboard, sticky header, tabbed home, drill-down student record */
:root{
  --bg:#f1f5f4; --surface:#ffffff; --surface-2:#e8efed; --ink:#15211f; --ink-2:#4d5d5a; --muted:#7f8e8b; --line:#d6e0de;
  --accent:#0b6b63; --accent-ink:#ffffff; --accent-soft:#d9eeea; --accent-2:#0f8a7f;
  --good:#1d7a42; --good-soft:#dcf1e3; --warn:#9a5c00; --warn-soft:#f8ead2; --bad:#b3261e; --bad-soft:#f8dedb; --info:#46587a; --info-soft:#e2e8f2;
  --font-display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --font-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --s1:#008a7c; --s2:#8a4bd6;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1413; --surface:#162020; --surface-2:#1d2a29; --ink:#e3ebe9; --ink-2:#a7b5b2; --muted:#6f7f7c; --line:#273533;
  --accent:#4cbdb0; --accent-ink:#06201d; --accent-soft:#163430; --accent-2:#6fd3c6;
  --good:#5cc486; --good-soft:#15301f; --warn:#e3a54a; --warn-soft:#33260f; --bad:#f07a70; --bad-soft:#3a1a18; --info:#9fb0d0; --info-soft:#1f2635; --s1:#26a497; --s2:#9a70ec;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1413; --surface:#162020; --surface-2:#1d2a29; --ink:#e3ebe9; --ink-2:#a7b5b2; --muted:#6f7f7c; --line:#273533;
  --accent:#4cbdb0; --accent-ink:#06201d; --accent-soft:#163430; --accent-2:#6fd3c6;
  --good:#5cc486; --good-soft:#15301f; --warn:#e3a54a; --warn-soft:#33260f; --bad:#f07a70; --bad-soft:#3a1a18; --info:#9fb0d0; --info-soft:#1f2635; --s1:#26a497; --s2:#9a70ec;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
#app{max-width:780px;margin:0 auto;padding:0 16px 48px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.top h1{font-size:19px;flex:1;min-width:0}
.top .sub{display:block;font-family:var(--font-body);font-size:12.5px;font-weight:500;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px;stroke:var(--ink-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;margin-block:14px;overflow-x:auto}
.tabs button{flex:1;border:0;background:transparent;padding:9px 8px;border-radius:9px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgb(0 0 0 / .08)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in oklab,var(--bad) 40%,var(--line))}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.small{padding:6px 10px;font-size:13.5px}
.btn.block{width:100%;padding:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field textarea,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:100%}
.field textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

.section{margin-top:26px}
.section-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.section-h h2{font-size:16px}
.section-h .meta{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list > *+*{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;min-width:0}
button.item{width:100%;border:0;background:transparent;text-align:start}
button.item:hover{background:var(--surface-2)}
.item .main{flex:1;min-width:0}
.item .name{font-weight:600}
.item .meta{color:var(--muted);font-size:13px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none;font-family:var(--font-display);font-size:14px}

.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.muted{background:var(--surface-2);color:var(--muted)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:500}
.stat .v{font-family:var(--font-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--muted);font-family:var(--font-body);font-weight:500}

.progress{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}

.empty{padding:30px 18px;text-align:center;color:var(--ink-2)}
.empty h3{font-size:16px;margin-bottom:6px;color:var(--ink)}
.empty p{margin:0 auto 14px;max-width:42ch;font-size:14px}

/* Chart */
.chart-wrap{position:relative;padding:12px 8px 6px}
.chart-wrap svg{display:block;width:100%;height:220px;direction:ltr}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-axis{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.ch-line{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch-area{fill:var(--s1);opacity:.08}
.ch-line.s2{stroke:var(--s2);stroke-dasharray:6 4}
.ch-dot.s2{fill:var(--s2)}
.ch-end.s2{fill:var(--ink-2)}
.ch-legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 14px 0;font-size:13px;color:var(--ink-2)}
.ch-legend span{display:inline-flex;align-items:center;gap:6px}
.ch-legend i{width:18px;height:0;border-top:3px solid var(--s1);display:inline-block;border-radius:2px}
.ch-legend i.s2{border-top:3px dashed var(--s2)}
.dscale{flex-wrap:wrap}
.dscale button{width:32px}
.dscale button.zero{width:auto;padding:0 8px;font-size:12px;font-weight:600}
.ch-dot{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.ch-end{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--font-body)}
.ch-cross{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-110%);z-index:3}

.bars{display:flex;flex-direction:column;gap:7px;padding:14px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 34px;gap:10px;align-items:center;font-size:13px}
.bar-row .lbl{direction:ltr;text-align:left;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:10px;background:var(--surface-2);border-radius:4px;overflow:hidden;direction:ltr}
.bar-fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.bar-fill.low{background:var(--bad)}

/* Evaluation form */
.att{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px}
.att button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-weight:600;font-size:14px}
.att button[aria-pressed="true"].present{background:var(--good);border-color:var(--good);color:#fff}
.att button[aria-pressed="true"].late{background:var(--warn);border-color:var(--warn);color:#fff}
.att button[aria-pressed="true"].absent{background:var(--bad);border-color:var(--bad);color:#fff}
.att button[aria-pressed="true"].left{background:var(--s2);border-color:var(--s2);color:#fff}
.pill.lft{background:color-mix(in oklab,var(--s2) 16%,var(--surface));color:var(--s2)}
.att button[aria-pressed="true"].excused{background:var(--info);border-color:var(--info);color:#fff}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.tog[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.crit-group h3{font-size:14px;color:var(--accent);padding:12px 14px 4px;font-family:var(--font-body);font-weight:700}
.crit{padding:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center}
.crit+.crit{border-top:1px solid var(--line)}
.crit .t{direction:ltr;text-align:left;font-size:14px;min-width:0}
.crit .t b{color:var(--muted);font-weight:600;margin-right:6px;font-variant-numeric:tabular-nums}
.scale{display:flex;gap:4px;direction:ltr}
.scale button{width:38px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:700;font-variant-numeric:tabular-nums}
.scale button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.crit.missing .t{color:var(--bad)}
@media (max-width:560px){.crit{grid-template-columns:1fr}.scale{justify-content:flex-end}.scale button{flex:1;max-width:56px}}
.legend-scale{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);direction:ltr;justify-content:flex-end}
.totalbar{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap}
.totalbar .score{font-family:var(--font-display);font-size:20px;font-weight:700}
.totalbar .score small{font-family:var(--font-body);font-size:13px;color:var(--muted);font-weight:500}

/* Library */
.lib-item{padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.check{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;margin-top:2px}
.check svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good)}
.check[aria-pressed="true"] svg{opacity:1}
.lib-item .desc{color:var(--ink-2);font-size:14px;white-space:pre-wrap;margin-top:4px}
.lib-item .desc.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.drug-dl{margin:8px 0 0;display:grid;gap:2px}
.drug-dl dt{font-size:12.5px;font-weight:700;color:var(--accent);margin-top:8px}
.drug-dl dd{margin:0;color:var(--ink-2);font-size:14px;white-space:pre-wrap}
a.link{text-decoration:none}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:0;font-size:13px}

/* Calendar */
.cal-month{padding:12px}
.cal-month h3{font-size:15px;margin:2px 4px 10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font-size:11.5px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.cal-day{aspect-ratio:1/1;max-width:100%;border:0;border-radius:9px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink-2);position:relative;padding:0}
.cal-day.out{visibility:hidden}
.cal-day.s-done{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal-day.s-upcoming{background:var(--accent-soft);color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--accent)}
.cal-day.s-today{background:var(--warn);color:#fff;font-weight:700}
.cal-day.s-cancelled{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.cal-day.sel{outline:2px solid var(--ink);outline-offset:1px}
.cal-day .dept{font-size:9.5px;font-weight:700;line-height:1;margin-top:2px;letter-spacing:.02em;opacity:.9}
.cal-day .plus{position:absolute;top:1px;left:4px;font-size:11px;font-weight:800;line-height:1}
.cal-day .dot{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:currentColor}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2);margin-top:10px}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.cal-months{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.wk{display:flex;flex-wrap:wrap;gap:6px}
.chipday{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600}
.chipday[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet h2{font-size:17px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100% - 32px);text-align:center}
.note-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:14px;color:var(--ink-2)}
.hist-note{font-size:13px;color:var(--ink-2);margin-top:2px;white-space:pre-wrap}
@media (prefers-reduced-motion:no-preference){.btn,.tog,.scale button,.check{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div id="app" dir="rtl" lang="ar"></div>
<div id="sheetHost" dir="rtl" lang="ar"></div>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== حط إعدادات Firebase تبعتك هون =====
   Firebase console > Project settings > General > Your apps > Web app > SDK setup and configuration > Config */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBzfnTdWlpAKLs7uFSUSXNAIaQHGcgCQrw",
  authDomain: "clinical-eval-86872.firebaseapp.com",
  projectId: "clinical-eval-86872",
  storageBucket: "clinical-eval-86872.firebasestorage.app",
  messagingSenderId: "359308110479",
  appId: "1:359308110479:web:dee3d408bf3c9632f69efa"
};
</script>
<script>
document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl';

/* ---------- Evaluation criteria: the two university forms merged, duplicates removed ---------- */
const CRITERIA = [
  { g: 'المهارات السريرية', items: [
    ['k1','Hand washing and use of PPE / precautionary measures'],
    ['k2','Physical assessment'],
    ['k3','Comprehends the information explained and the skills practiced'],
    ['k4','Prioritizes nursing activities that reflect patient needs'],
    ['k5','Provides care within an acceptable timeframe'],
    ['k6','Follows up the case, carries out required tasks, shows knowledge of cases'],
  ]},
  { g: 'الالتزام والمظهر', items: [
    ['k7','Punctuality, time commitment and preparedness'],
    ['k8','Personal hygiene, professional appearance and dress code'],
    ['k9','Adheres to university, faculty and hospital rules and policies'],
    ['k10','Initiative, motivation and interest in care assignments'],
    ['k11','Commitment to assignment deadlines'],
  ]},
  { g: 'التواصل والأخلاقيات', items: [
    ['k12','Effective communication and collaboration with patients, colleagues and the inter-professional team'],
    ['k13','Keeps patient and family informed; explains treatment and procedures'],
    ['k14','Respect for oneself and others'],
    ['k15','Accepts constructive criticism'],
    ['k16','Seeks advice and assistance when unsure'],
    ['k17','Honesty and integrity'],
    ['k18','Maintains patient confidentiality'],
    ['k19','Acknowledges ethical and legal issues in patient care'],
    ['k20','Deals with stress and conflicts objectively without taking it out on others'],
  ]},
];
const ALL_CRIT = CRITERIA.flatMap(g => g.items);
const MAX = ALL_CRIT.length * 5;
const CRIT_NUM = Object.fromEntries(ALL_CRIT.map((c, i) => [c[0], i + 1]));

const DRUG_FIELDS = [
  ['title', 'الدواء (الاسم التجاري)', 'text'],
  ['generic', 'الاسم العلمي', 'text'],
  ['moa', 'Mechanism of action', 'textarea'],
  ['sides', 'الآثار الجانبية', 'textarea'],
  ['use', 'الاستخدام', 'textarea'],
  ['cautions', 'Cautions', 'textarea'],
];
const isScored = a => a === 'present' || a === 'late' || a === 'left';
const ATT = {
  present: { l: 'حاضر', c: 'good', icon: '✓' },
  late:    { l: 'متأخر', c: 'warn', icon: '◷' },
  absent:  { l: 'غائب', c: 'bad', icon: '✗' },
  excused: { l: 'غياب بعذر', c: 'info', icon: '•' },
  left:    { l: 'غادر أثناء الدوام', c: 'lft', icon: '↦' },
};
const DOW = [ [6,'السبت'],[0,'الأحد'],[1,'الإثنين'],[2,'الثلاثاء'],[3,'الأربعاء'],[4,'الخميس'],[5,'الجمعة'] ];
const DOW_NAME = Object.fromEntries(DOW);
const DEFAULT_SETTINGS = {
  instructor: '', setting: '', course: 'Medical Surgical Nursing',
  requiredDocs: [],
  dailyItems: ['Nursing Note', 'Hand Over'],
  searchHistory: { topics: [], drugs: [] }, semStart: '', weeks: 18, shiftStart: '07:00', shiftEnd: '14:00', dayHours: {}, cancelNotes: {}, dayDept: {}, deptAssign: {}, departments: ['ICU', 'CCU', 'MW', 'SU', 'ER', 'OR', 'RW'], clinicalDays: [6], cancelled: [], extraDays: [],
};

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const st = {

/* ---------- Writes (one at a time per document) ---------- */
const chains = {};
function write(ref, data) {
  const k = ref.path;
  const p = (chains[k] || Promise.resolve()).then(() => data === null ? ref.delete() : ref.set(data));
  chains[k] = p.catch(() => {});
  return p.catch(e => { toast(errText(e)); throw e; });
}
function errText(e) {
  if (e && e.code === 'quota_exceeded') return 'امتلأت مساحة التخزين. احذف بيانات قديمة ثم حاول مرة ثانية.';
  if (e && e.code === 'permission-denied') return 'Firebase رفض الحفظ. تأكد إنك مسجل دخول ومن قواعد Firestore.';
  return 'صار خطأ بالحفظ. حاول مرة ثانية.';
}
const saveSettings = patch => { st.settings = { ...st.settings, ...patch }; render(); return write(refs.root, st.settings); };

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }

/* ---------- Derived data ---------- */
function evalsOf(sid) { return Object.values(st.evals).filter(e => e.sid === sid).sort((a, b) => a.date.localeCompare(b.date)); }
function studentStats(sid) {
  const ev = evalsOf(sid);
  const scored = ev.filter(e => pctOf(e) != null);
  const avg = scored.length ? scored.reduce((s, e) => s + e.pct, 0) / scored.length : null;
  const cnt = { present: 0, late: 0, left: 0, absent: 0, excused: 0 };
  ev.forEach(e => cnt[e.att] = (cnt[e.att] || 0) + 1);
  const stu = st.students[sid]; const rd = reqDocs();
  const docsDone = rd.filter(d => docOf(stu, d.name)).length;
  let docScore = 0, docMax = 0, docGraded = 0;
  rd.forEach(d => { const v = docOf(stu, d.name); if (d.max) docMax += Number(d.max); if (v && typeof v.score === 'number') { docScore += v.score; docGraded++; } });
  const dv = scored.map(dailyPct).filter(Boolean); const dAvg = dv.length ? dv.reduce((a, b) => a + b.pct, 0) / dv.length : null;
  return { dAvg, ev, scored, avg, cnt, docsDone, docScore, docMax, docGraded, last: scored[scored.length - 1] };
}
function schedule() {

}
function weekOf(d) { const s = st.settings.semStart; if (!s) return null; return Math.floor((parse(d) - parse(s)) / 864e5 / 7) + 1; }

  const cancelled = (st.settings.cancelled || []).includes(d);

const deptOf = d => (st.settings.dayDept || {})[d] || '';
const deptFor = (sid, d) => ((st.settings.deptAssign || {})[d] || {})[sid] || deptOf(d);
function deptsOfDay(d) { const set = new Set(); const ids = Object.keys(st.students); ids.forEach(id => { const x = deptFor(id, d); if (x) set.add(x); }); if (!ids.length && deptOf(d)) set.add(deptOf(d)); return [...set]; }
function deptCounts(d) { const c = {}; Object.keys(st.students).forEach(id => { const x = deptFor(id, d) || 'بدون قسم'; c[x] = (c[x] || 0) + 1; }); return c; }

/* ---------- Render ---------- */

  if (st.err) app.innerHTML = headerHTML('سجل التقييم السريري') + `<div class="empty section"><h3>ما قدرنا نفتح البيانات</h3><p>${esc(st.err)}</p></div>`;
  else if (st.needLogin) app.innerHTML = loginView();
  else if (!st.ready) app.innerHTML = headerHTML('سجل التقييم السريري') + `<div class="empty section"><p>جارٍ تحميل بيانات الطلاب…</p></div>`;
  else if (st.view === 'student' && st.students[st.sid]) app.innerHTML = studentView();
  else if (st.view === 'eval' && st.draft) app.innerHTML = evalView();

}

  const done = items.filter(i => i.done).length;
  const q = st.libQ.trim().toLowerCase();
  const shown = items.filter(i => !q || [i.title, i.cls, i.desc, i.generic, i.moa, i.sides, i.use, i.cautions].join(' ').toLowerCase().includes(q));
  const head = `<div class="panel" style="padding:12px 14px;display:flex;flex-direction:column;gap:8px">

/* ---------- Chart ---------- */
function drawChart() {
  const host = document.getElementById('chart'); if (!host) return;
  const pts = evalsOf(st.sid).filter(e => pctOf(e) != null).map(e => ({ ...e, dp: dailyPct(e) }));
  const W = Math.max(280, host.clientWidth - 16), H = 230, m = { l: 38, r: 30, t: 20, b: 28 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const x = i => m.l + (pts.length === 1 ? iw / 2 : i * iw / (pts.length - 1));
  const y = v => m.t + ih - v / 100 * ih;
  let g = '';
  [0, 25, 50, 75, 100].forEach(v => { g += `<line class="ch-grid" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-axis" x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}%</text>`; });
  const step = Math.max(1, Math.ceil(pts.length / 6));
  pts.forEach((p, i) => { if (i % step === 0 || i === pts.length - 1) g += `<text class="ch-axis" x="${x(i)}" y="${H - 8}" text-anchor="middle">${shortDate(p.date)}</text>`; });
  const series = [
    { cls: '', vals: pts.map((p, i) => [i, p.pct]) },
    { cls: 's2', vals: pts.map((p, i) => p.dp ? [i, p.dp.pct] : null).filter(Boolean) },
  ];
  let body = '';
  const s1 = series[0].vals; const line1 = s1.map(([i, v], k) => `${k ? 'L' : 'M'}${x(i)},${y(v)}`).join('');
  if (s1.length > 1) body += `<path class="ch-area" d="${line1}L${x(s1[s1.length - 1][0])},${y(0)}L${x(s1[0][0])},${y(0)}Z"/>`;
  const ends = [];
  series.forEach(sr => {
    if (!sr.vals.length) return;
    const d = sr.vals.map(([i, v], k) => `${k ? 'L' : 'M'}${x(i)},${y(v)}`).join('');
    body += `<path class="ch-line ${sr.cls}" d="${d}"/>`;
    body += sr.vals.map(([i, v], k) => `<circle class="ch-dot ${sr.cls}" cx="${x(i)}" cy="${y(v)}" r="${k === sr.vals.length - 1 ? 5.5 : 4}"/>`).join('');
    const [li, lv] = sr.vals[sr.vals.length - 1]; ends.push({ cls: sr.cls, i: li, v: lv });
  });
  // end labels, nudged apart when they collide
  if (ends.length === 2 && ends[0].i === ends[1].i && Math.abs(y(ends[0].v) - y(ends[1].v)) < 16) {
    const up = ends[0].v >= ends[1].v ? 0 : 1; ends[up].dy = -10; ends[1 - up].dy = 18;
  }
  ends.forEach(e => { const dy = e.dy ?? -10; body += `<text class="ch-end ${e.cls}" x="${Math.min(x(e.i) + (pts.length === 1 ? 0 : 4), W - 2)}" y="${Math.max(12, y(e.v) + dy)}" text-anchor="${pts.length === 1 ? 'middle' : 'end'}">${Math.round(e.v)}%</text>`; });
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="تطور التقييم اليومي والتسليمات">${g}${body}<line id="cross" class="ch-cross" y1="${m.t}" y2="${m.t + ih}" visibility="hidden"/><rect x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  const svg = host.querySelector('svg'), tip = host.querySelector('.tip'), cross = host.querySelector('#cross');
  const move = ev => {
    const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) * W / r.width;
    let bi = 0, bd = Infinity; pts.forEach((p, i) => { const dd = Math.abs(x(i) - px); if (dd < bd) { bd = dd; bi = i; } });
    const p = pts[bi]; cross.setAttribute('x1', x(bi)); cross.setAttribute('x2', x(bi)); cross.setAttribute('visibility', 'visible');
    tip.hidden = false; tip.innerHTML = `${esc(longDate(p.date))} · ${ATT[p.att].l}${p.att === 'left' && p.leaveTime ? ' ' + esc(fmtT(p.leaveTime)) : ''}<br>البنود: <b class="num">${Math.round(p.pct)}%</b> <span class="num">(${p.total}/${MAX})</span>` +
      (p.dp ? `<br>التسليمات: <b class="num">${Math.round(p.dp.pct)}%</b> <span class="num">(${fmtN(p.dp.sum)}/${p.dp.max})</span>` : '');
    tip.style.left = (svg.offsetLeft + x(bi) * r.width / W) + 'px'; tip.style.top = (svg.offsetTop + y(Math.max(p.pct, p.dp?.pct ?? 0)) * r.height / H - 6) + 'px';
  };
  svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); });
}

/* ---------- Evaluation draft ---------- */
function loadDraft(sid, date) {
  const e = st.evals[sid + '_' + date];
  st.draft = e ? { sid, date, att: e.att, scores: { ...(e.scores || {}) }, daily: Object.fromEntries((st.settings.dailyItems || []).map(it => [it, dScore(e, it)]).filter(([, v]) => v != null)), note: e.note || '', leaveTime: e.leaveTime || '', leaveReason: e.leaveReason || '', dailyMax: DMAX, exists: true }
    : { sid, date, att: 'present', scores: {}, daily: {}, note: '', dailyMax: DMAX, exists: false };
  st.showMissing = false; st.confirm = null;
}
function saveEval() {
  const d = st.draft; const scored = isScored(d.att);
  const vals = ALL_CRIT.map(([id]) => d.scores[id]).filter(v => typeof v === 'number');
  const cleanScores = Object.fromEntries(ALL_CRIT.filter(([id]) => typeof d.scores[id] === 'number').map(([id]) => [id, d.scores[id]]));
  if (scored && vals.length < ALL_CRIT.length) { st.showMissing = true; render(); toast(`باقي ${ALL_CRIT.length - vals.length} بند بدون علامة (معلّمين بالأحمر)`); return; }
  const total = vals.reduce((a, b) => a + b, 0);
  if (d.att === 'left' && !d.leaveTime) { toast('حدد ساعة المغادرة'); document.getElementById('leaveTime')?.focus(); return; }
  const data = { sid: d.sid, date: d.date, att: d.att, note: d.note, updatedAt: Date.now(),
    leaveTime: d.att === 'left' ? d.leaveTime : null, leaveReason: d.att === 'left' ? (d.leaveReason || '').trim() : null,
    scores: scored ? cleanScores : {}, daily: scored ? d.daily : {}, total: scored ? total : null, pct: scored ? total / MAX * 100 : null,
    dailyMax: DMAX, dailyPct: scored && dailyPct(d) ? dailyPct(d).pct : null };
  write(refs.evals.doc(d.sid + '_' + d.date), data);
  toast('تم حفظ تقييم ' + longDate(d.date));
  st.view = 'student'; st.draft = null; render(); window.scrollTo(0, 0);
}

    rows.push([s.name, s.bu || '', e.date, dayName(e.date), deptFor(sid, e.date), ATT[e.att]?.l || '', e.att === 'left' ? (e.leaveTime || '') : '', e.att === 'left' ? (e.leaveReason || '') : '', ...set.dailyItems.map(d => sc ? (dScore(e, d) ?? '') : ''),
      ...ALL_CRIT.map(([id]) => sc ? (e.scores?.[id] ?? '') : ''), sc ? e.total : '', sc ? Math.round(e.pct * 10) / 10 : '', e.note || '']); }); });
  return sheetOf(rows, [22, 12, 11, 9, 8, 14, 11, 22, ...set.dailyItems.map(() => 14), ...ALL_CRIT.map(() => 8), 12, 9, 40]);
}
function summaryRows(sids) {
  const set = st.settings;
  const rd = reqDocs();
  const head = ['اسم الطالب', 'الرقم الجامعي', 'الهاتف', 'أيام مسجلة', 'حاضر', 'متأخر', 'غادر أثناء الدوام', 'غائب', 'غياب بعذر', 'متوسط التقييم %', 'متوسط التسليمات اليومية %', ...rd.map(d => d.max ? `${d.name} (من ${fmtN(d.max)})` : d.name), 'مجموع علامات الأوراق', 'معلومات إضافية'];
  const rows = [head];
  sids.forEach(sid => { const s = st.students[sid]; const x = studentStats(sid);
    rows.push([s.name, s.bu || '', s.phone || '', x.ev.length, x.cnt.present, x.cnt.late, x.cnt.left, x.cnt.absent, x.cnt.excused, x.avg != null ? Math.round(x.avg * 10) / 10 : '', x.dAvg != null ? Math.round(x.dAvg * 10) / 10 : '',
      ...rd.map(d => { const v = docOf(s, d.name); return !v ? 'لم يسلّم' : typeof v.score === 'number' ? v.score : 'سلّم بدون علامة'; }),
      x.docMax ? `${fmtN(x.docScore)} / ${fmtN(x.docMax)}` : (x.docGraded ? fmtN(x.docScore) : ''), s.notes || '']); });
  return sheetOf(rows, [22, 12, 13, 10, 7, 7, 14, 7, 9, 13, 18, ...rd.map(() => 16), 18, 30]);
}
function libRows(map, drug) {
  const rows = [[drug ? 'اسم الدواء' : 'الموضوع', 'شرحناه', 'تاريخ الشرح']];
  Object.values(map).sort((a, b) => (a.title || '').localeCompare(b.title || '', 'ar')).forEach(i => rows.push([i.title, i.done ? 'نعم' : 'لا', i.doneDate || '']));
  return sheetOf(rows, [30, 8, 12]);
}
function calRows() {
  const cs = calSummary(); const { sched, evd } = cs; const rows = [['الأسبوع', 'التاريخ', 'اليوم', 'القسم', 'الحالة', 'من', 'إلى', 'الساعات', 'عدد التقييمات', 'ملاحظة']];
  sched.forEach(d => { const s = dayStatus(d, sched, evd); const tm = dayTimes(d); const c = s === 'cancelled';
    rows.push([weekOf(d), d, dayName(d), c ? '' : Object.entries(deptCounts(d)).map(([k, v]) => Object.keys(st.students).length ? `${k} (${v})` : k).join('، ') || deptOf(d), ({ done: 'داومنا', upcoming: 'قادم', today: 'اليوم', cancelled: 'ملغى' })[s] || '', c ? '' : tm.start, c ? '' : tm.end, Math.round(dayH(d) * 100) / 100, evd[d] || 0, c ? ((st.settings.cancelNotes || {})[d] || '') : '']); });
  rows.push([]); rows.push(['المطلوب بالفصل', '', '', '', '', '', '', Math.round(cs.reqH * 100) / 100]);
  rows.push(['المجدول', '', '', '', '', '', '', Math.round(cs.planH * 100) / 100]); rows.push(['داومنا', '', '', '', '', '', '', Math.round(cs.doneH * 100) / 100]);
  rows.push(['أيام داومناها فعلياً', '', '', '', '', '', '', cs.done]); rows.push(['بالساعات بتعادل (يوم)', '', '', '', '', '', '', Math.round(eqDays(cs.doneH) * 10) / 10]);
  if (cs.gapH > 0.01) rows.push(['ناقص لازم يتعوض', '', '', '', '', '', '', Math.round(cs.gapH * 100) / 100]);
  return sheetOf(rows, [16, 12, 10, 8, 10, 8, 8, 9, 13, 30]);
}
async function exportXlsx(sids, fname, withLib) {
  if (typeof XLSX === 'undefined') { toast('مكتبة Excel ما تحمّلت. حدّث الصفحة وجرّب مرة ثانية.'); return; }
  const wb = XLSX.utils.book_new(); wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.utils.book_append_sheet(wb, summaryRows(sids), 'ملخص الطلاب');
  XLSX.utils.book_append_sheet(wb, evalRows(sids), 'التقييم اليومي');
  if (withLib) {
    XLSX.utils.book_append_sheet(wb, calRows(), 'أيام الدوام');
    XLSX.utils.book_append_sheet(wb, libRows(st.topics, false), 'المواضيع');
    XLSX.utils.book_append_sheet(wb, libRows(st.drugs, true), 'الأدوية');
  }
  try { XLSX.writeFile(wb, fname, { compression: true }); toast('تم تنزيل الملف'); }
  catch (e) { console.error(e); toast('ما قدرنا ننزّل الملف'); }
}

/* ---------- Events ---------- */
function arm(key) { st.confirm = key; render(); clearTimeout(arm.t); arm.t = setTimeout(() => { if (st.confirm === key) { st.confirm = null; render(); } }, 4000); }
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act; const [a, b, c] = act.split(':');
  if (a === 'sheet-close') { if (el.classList.contains('scrim') && ev.target !== el) return; closeSheet(); return; }
  if (a === 'sheet-del') { ev.preventDefault(); const { kind, id } = sheetCtx; if (st.confirm !== 'sheetdel') { st.confirm = 'sheetdel'; el.textContent = 'تأكيد الحذف'; el.classList.add('armed'); return; }
    write((kind === 'topics' ? refs.topics : refs.drugs).doc(id), null); st.confirm = null; closeSheet(); toast('تم الحذف'); return; }
  switch (a) {
    case 'lg-mode': st.login.mode = b; st.login.msg = ''; render(); break;
    case 'logout':
      if (st.confirm !== 'logout') { arm('logout'); break; }
      st.confirm = null; await firebase.auth().signOut(); location.reload(); break;
    case 'tab': if (st.tab !== b) { clearTimeout(histT); if (st.libQ.trim() && (st.tab === 'topics' || st.tab === 'drugs')) addHistory(st.tab, st.libQ); st.libQ = ''; } st.tab = b; render(); break;
    case 'back':
      if (st.view === 'eval') { st.view = 'student'; st.draft = null; } else { st.view = 'home'; st.sid = null; }
      st.confirm = null; render(); window.scrollTo(0, 0); break;
    case 'settings': st.view = 'settings'; st.confirm = null; render(); window.scrollTo(0, 0); break;
    case 'open-student': st.sid = b; st.view = 'student'; st.confirm = null; render(); window.scrollTo(0, 0); break;
    case 'add-student': openSheet('student'); break;
    case 'edit-student': openSheet('student', st.sid); break;
    case 'add-topics': case 'add-drugs': openSheet(a.slice(4)); break;
    case 'edit-topics': case 'edit-drugs': openSheet(a.slice(5), b); break;
    case 'expand': st.open.has(b) ? st.open.delete(b) : st.open.add(b); render(); break;
    case 'toggle-lib': { const map = b === 'topics' ? st.topics : st.drugs; const col = b === 'topics' ? refs.topics : refs.drugs; const it = map[c]; if (!it) break;
      const data = { ...it, done: !it.done, doneDate: !it.done ? today() : null }; delete data.id; write(col.doc(c), data); break; }
    case 'toggle-doc': { const s = st.students[st.sid]; const name = reqDocs()[Number(b)]?.name; if (!name) break; const docs = { ...(s.docs || {}) };
      if (docs[name]) delete docs[name]; else docs[name] = { date: today(), score: null }; const data = { ...s, docs }; delete data.id; write(refs.students.doc(s.id), data); break; }
    case 'del-student': {
      if (st.confirm !== 'del-student') { arm('del-student'); break; }
      const sid = st.sid; evalsOf(sid).forEach(e => write(refs.evals.doc(e.id), null)); write(refs.students.doc(sid), null);
      st.view = 'home'; st.sid = null; st.confirm = null; render(); toast('تم حذف الطالب'); break; }
    case 'eval-open': loadDraft(st.sid, b); st.view = 'eval'; render(); window.scrollTo(0, 0); break;
    case 'att': st.draft.att = b; render(); break;
    case 'dscore': { const it = st.settings.dailyItems[Number(b)]; if (it == null) break; st.draft.daily[it] = st.draft.daily[it] === Number(c) ? null : Number(c); if (st.draft.daily[it] == null) delete st.draft.daily[it]; render(); break; }
    case 'score': st.draft.scores[b] = Number(c); render(); break;
    case 'fill': ALL_CRIT.forEach(([id]) => st.draft.scores[id] = Number(b)); render(); break;
    case 'save-eval': saveEval(); break;
    case 'del-eval':
      if (st.confirm !== 'del-eval') { arm('del-eval'); break; }
      write(refs.evals.doc(st.draft.sid + '_' + st.draft.date), null); st.view = 'student'; st.draft = null; st.confirm = null; render(); toast('تم حذف التقييم'); break;
    case 'export-all': exportXlsx(Object.keys(st.students).sort((x, y) => (st.students[x].name || '').localeCompare(st.students[y].name || '', 'ar')), `clinical-evaluation-${today()}.xlsx`, true); break;
    case 'export-student': { const s = st.students[st.sid]; exportXlsx([st.sid], `${(s.bu || s.name || 'student').replace(/[\\/:*?"<>|]/g, '')}-evaluation-${today()}.xlsx`, false); break; }
    case 'rm': { const arr = (b === 'requiredDocs' ? reqDocs() : st.settings[b]).slice(); arr.splice(Number(c), 1); saveSettings({ [b]: arr }); break; }
    case 'addto': { const inp = document.getElementById('add-' + b); const v = inp.value.trim(); if (!v) { toast('اكتب الاسم أولاً'); break; }
      if (b === 'requiredDocs') { const rd = reqDocs(); if (rd.some(d => d.name === v)) { toast('موجودة من قبل'); break; }
        const mx = document.getElementById('add-docmax'); const m = parseFloat(mx.value); inp.value = ''; mx.value = '';
        saveSettings({ requiredDocs: [...rd, { name: v, max: isFinite(m) && m > 0 ? m : null }] }); break; }
      if (st.settings[b].includes(v)) { toast('موجود من قبل'); break; } inp.value = ''; saveSettings({ [b]: [...st.settings[b], v] }); break; }
    case 'dow': { const n = Number(b); const cur = st.settings.clinicalDays || []; saveSettings({ clinicalDays: cur.includes(n) ? cur.filter(x => x !== n) : [...cur, n] }); break; }
    case 'hist': { const t = (st.settings.searchHistory?.[b] || [])[Number(c)]; if (t == null) break; st.libQ = st.libQ.trim() === t ? '' : t; render(); break; }
    case 'hist-clear': saveSettings({ searchHistory: { ...(st.settings.searchHistory || {}), [b]: [] } }); break;
    case 'day-reset': { const dh = { ...(st.settings.dayHours || {}) }; delete dh[b]; saveSettings({ dayHours: dh }); break; }
    case 'day-long': { const dh = { ...(st.settings.dayHours || {}) }; dh[b] = { start: dayTimes(b).start, end: '19:00' }; saveSettings({ dayHours: dh }); break; }
    case 'dept': { const dp = act.slice(('dept:' + b + ':').length); const m = { ...(st.settings.dayDept || {}) }; if (m[b] === dp) delete m[b]; else m[b] = dp; saveSettings({ dayDept: m }); break; }
    case 'dist': st.distOpen = st.distOpen === b ? null : b; render(); break;
    case 'sdept': { const pre = 'sdept:' + b + ':' + c + ':'; const dp = act.slice(pre.length); setStudentDept(b, c, deptFor(c, b) === dp ? '' : dp); break; }
    case 'cal': st.calSel = st.calSel === b ? null : b; render(); break;
    case 'cal-cancel': { const cur = st.settings.cancelled || []; const on = !cur.includes(b); saveSettings({ cancelled: on ? [...cur, b] : cur.filter(x => x !== b) });
      if (on) setTimeout(() => document.getElementById('cancelNote')?.focus(), 50); break; }
    case 'cal-extra': { const cur = st.settings.extraDays || []; saveSettings({ extraDays: cur.includes(b) ? cur.filter(x => x !== b) : [...cur, b] }); break; }
    case 'end-sem': {
      if (st.confirm !== 'end-sem') { arm('end-sem'); break; }
      st.confirm = null; toast('جارٍ حذف بيانات الفصل…');
      const jobs = [];
      Object.keys(st.evals).forEach(id => jobs.push(write(refs.evals.doc(id), null)));
      Object.keys(st.students).forEach(id => jobs.push(write(refs.students.doc(id), null)));
      [[st.topics, refs.topics], [st.drugs, refs.drugs]].forEach(([map, col]) => Object.values(map).filter(i => i.done).forEach(i => { const d = { ...i, done: false, doneDate: null }; delete d.id; jobs.push(write(col.doc(i.id), d)); }));
      jobs.push(saveSettings({ cancelled: [], extraDays: [], dayHours: {}, cancelNotes: {}, dayDept: {}, deptAssign: {}, semStart: '' }));
      await Promise.allSettled(jobs); st.view = 'home'; st.tab = 'students'; render(); toast('بلّشنا فصل جديد'); break; }
  }
});
document.addEventListener('input', ev => {
  const k = ev.target.dataset.bind; if (!k) return;
  if (k === 'note') { st.draft.note = ev.target.value; return; }
  if (k === 'leaveReason') { st.draft.leaveReason = ev.target.value; return; }
  st[k] = ev.target.value; render();
  if (k === 'libQ') { clearTimeout(histT); const kind = st.tab; histT = setTimeout(() => addHistory(kind, st.libQ), 1500); }
});
document.addEventListener('change', ev => {
  const k = ev.target.dataset.change; if (!k) return; const v = ev.target.value;
  if (k === 'leaveTime') { st.draft.leaveTime = v; render(); return; }
  if (k === 'evdate') { if (!v) return; const note = st.draft.note; loadDraft(st.draft.sid, v); if (!st.draft.exists) st.draft.note = note; render(); return; }
  if (k === 'docmax') { const rd = reqDocs().map(d => ({ ...d })); const i = Number(ev.target.dataset.i); const m = parseFloat(v); rd[i].max = isFinite(m) && m > 0 ? m : null; saveSettings({ requiredDocs: rd }); return; }
  if (k === 'docscore') { const d = reqDocs()[Number(ev.target.dataset.i)]; const s = st.students[st.sid]; if (!d || !s) return;
    const docs = { ...(s.docs || {}) }; const prev = docOf(s, d.name);
    if (v === '') { if (prev) docs[d.name] = { ...prev, score: null }; }
    else { const n = parseFloat(v); if (!isFinite(n) || n < 0) { toast('اكتب علامة صحيحة'); render(); return; }
      if (d.max && n > d.max) { toast(`العلامة أكبر من ${fmtN(d.max)}`); render(); return; }
      docs[d.name] = { date: prev?.date || today(), score: n }; }
    const data = { ...s, docs }; delete data.id; write(refs.students.doc(s.id), data); return; }
  if (k === 'dayStart' || k === 'dayEnd') { if (!v) return; const d = ev.target.dataset.d; const cur = dayTimes(d); const dh = { ...(st.settings.dayHours || {}) };
    const nx = { start: k === 'dayStart' ? v : cur.start, end: k === 'dayEnd' ? v : cur.end };
    if (nx.start === st.settings.shiftStart && nx.end === st.settings.shiftEnd) delete dh[d]; else dh[d] = nx; saveSettings({ dayHours: dh }); return; }
  if (k === 'cancelNote') { const cn = { ...(st.settings.cancelNotes || {}) }; const t = v.trim(); if (t) cn[ev.target.dataset.d] = t; else delete cn[ev.target.dataset.d]; saveSettings({ cancelNotes: cn }); return; }
  if (k === 'weeks') { const n = Math.max(1, Math.min(30, parseInt(v, 10) || 18)); saveSettings({ weeks: n }); return; }
  saveSettings({ [k]: v.trim() });
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && sheetCtx) closeSheet();
  if (ev.key === 'Enter' && ev.target.id && ev.target.id.startsWith('add-')) { ev.preventDefault(); const k = ev.target.id === 'add-docmax' ? 'requiredDocs' : ev.target.id.slice(4); document.querySelector(`[data-act="addto:${k}"]`)?.click(); }
  if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.change && ev.target.tagName === 'INPUT') ev.target.blur();
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawChart, 150); });

/* ---------- Boot ---------- */
render();
(function boot() {
  if (typeof firebase === 'undefined') { st.err = 'ما قدرنا نحمّل Firebase. تأكد من الإنترنت وحدّث الصفحة.'; render(); return; }
  if (!FIREBASE_CONFIG || !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith('PASTE')) { st.err = 'لازم تحط إعدادات Firebase تبعتك بأول ملف index.html (FIREBASE_CONFIG).'; render(); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  const fs = firebase.firestore();
  try { fs.settings({ ignoreUndefinedProperties: true, merge: true }); } catch (_) {}
  fs.enablePersistence({ synchronizeTabs: true }).catch(() => {});
  let unsubs = [];
  firebase.auth().onAuthStateChanged(u => {
    unsubs.forEach(f => f()); unsubs = [];
    if (!u) { st.needLogin = true; st.ready = false; render(); return; }
    st.needLogin = false; st.userEmail = u.email || ''; st.ready = false; render();
    const root = fs.doc(`users/${u.uid}`);
    refs = { root, students: root.collection('students'), evals: root.collection('evals'), topics: root.collection('topics'), drugs: root.collection('drugs') };
    const seen = new Set(); const mark = k => { if (!seen.has(k)) { seen.add(k); if (seen.size === 5) st.ready = true; } };
    let raf; const later = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); };
    const onErr = e => { console.error(e); st.err = e && e.code === 'permission-denied' ? 'Firebase رفض الوصول. تأكد من قواعد Firestore (Rules) زي ما بالتعليمات.' : 'صار خطأ بالاتصال بـ Firebase: ' + (e.code || e.message); later(); };
    unsubs.push(root.onSnapshot(sn => { st.settings = { ...DEFAULT_SETTINGS, ...(sn.exists ? sn.data() : {}) }; mark('root'); later(); }, onErr));
    const sub = (key, col) => unsubs.push(col.onSnapshot(sn => { st[key] = Object.fromEntries(sn.docs.map(d => [d.id, { ...d.data(), id: d.id }])); mark(key); later(); }, onErr));
    sub('students', refs.students); sub('evals', refs.evals); sub('topics', refs.topics); sub('drugs', refs.drugs);
  });
})();
